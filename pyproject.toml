[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "berman"
version = "0.26.8"
description = "Intermittent project management with additional actor jobs and verifiable episode records on Linux."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = ["Operating System :: POSIX :: Linux"]

[dependency-groups]
dev = ["import-linter>=2.16", "ruff>=0.17.5,<0.18"]

[project.scripts]
berman = "berman.cli:main"

[project.urls]
Repository = "https://github.com/Protonk/berman"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
berman = ["templates/*.md"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.importlinter]
root_package = "berman"

[[tool.importlinter.contracts]]
name = "Episode commands, collection, native capture, and file operations"
type = "layers"
layers = [
  "berman.__main__",
  "berman.cli",
  "berman.episodes",
  "berman.records | berman.capture",
  "berman.claude | berman.codex | berman.snapshots | berman.project | berman.installation",
  "berman.files",
]
